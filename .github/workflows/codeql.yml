# CodeQL static analysis for filesrv.
#
# Runs GitHub CodeQL on every push to master, every pull request targeting
# master, and on a weekly schedule so newly published queries find issues in
# code that has not changed.
#
# BUILD MODE — `none`, and it is required, not a preference:
# CodeQL's Rust extractor parses the source directly with its own front end and
# does NOT support `manual` (it hard-fails with "Rust does not support the manual
# build mode. Please try using one of the following build modes instead: none")
# or `autobuild`. Because no build happens, there is deliberately no Cargo or
# rust-toolchain step here: adding one would only cost minutes per run without
# changing what is analysed. All source files (lib, src/bin/rekey.rs and the
# integration tests) are covered by tree extraction.
#
# CodeQL Action v4 is used because v3 is deprecated (December 2026).
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, Monday 03:17 UTC — off the hour to avoid the top-of-hour queue.
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Least privilege: the analysis only reads the repo and uploads results.
permissions:
  contents: read
  security-events: write
  actions: read

# A newer push/PR run supersedes an in-flight one for the same ref.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rust requires `build-mode: none` (see the header comment); `manual` and
      # `autobuild` are both unsupported by the Rust extractor.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
