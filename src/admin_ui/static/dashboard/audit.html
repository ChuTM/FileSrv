<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>File Storage Service · Audit Log</title>
<link rel="stylesheet" href="/admin/dashboard.css?v=9">
</head>
<body data-page="audit">

<div id="app-shell" class="shell">
  <aside id="sidebar" class="sidebar">
    <div class="side-brand"><span>File Storage Service</span></div>
    <nav class="side-nav">
      <a class="nav-item" href="/dashboard/apps"><span class="nav-ico" data-icon="apps"></span>Apps</a>
      <a class="nav-item active" href="/dashboard/audit"><span class="nav-ico" data-icon="audit"></span>Audit Log</a>
      <a class="nav-item" href="/dashboard/backup"><span class="nav-ico" data-icon="backup"></span>Backup</a>
      <a class="nav-item" href="/dashboard/archive"><span class="nav-ico" data-icon="archive"></span>Archive</a>
    </nav>
    <div class="side-foot">
      <a class="btn btn-ghost btn-block" href="/dashboard/settings"><span class="nav-ico" data-icon="settings"></span>Settings</a>
      <button id="btn-logout" class="btn btn-ghost btn-block">Sign out</button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button id="btn-menu" class="icon-btn" aria-label="Toggle menu"><span data-icon="menu"></span></button>
        <h2 class="view-title">Audit Log</h2>
      </div>
      <div class="topbar-actions"></div>
    </header>
    <p id="global-error" class="banner banner-error" role="alert" hidden></p>

    <section id="view-audit" class="view">
      <div class="table-card">
        <div class="filter-bar">
          <label class="field inline">
            <span class="field-label">App ID</span>
            <input id="audit-app-id" type="number" min="1" placeholder="All" spellcheck="false">
          </label>
          <label class="field inline">
            <span class="field-label">Time range</span>
            <select id="audit-since">
              <option value="0">All</option>
              <option value="86400">Last 24 hours</option>
              <option value="604800">Last 7 days</option>
              <option value="2592000">Last 30 days</option>
            </select>
          </label>
          <button id="audit-refresh" class="btn btn-ghost">Refresh</button>
        </div>
        <div id="audit-table-wrap" class="table-wrap"></div>
      </div>
    </section>
  </main>
</div>

<div id="modal-root"></div>

<script src="/admin/gsap.min.js?v=4" defer></script>
<script src="/admin/app.js?v=16" defer></script>
</body>
</html>
