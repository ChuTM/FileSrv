<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>File Storage Service · Admin Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login view: shown when no admin token is held -->
<div id="view-login" class="login-wrap" hidden>
  <form id="login-form" class="login-card" autocomplete="off">
    <div class="brand-mark" aria-hidden="true"></div>
    <h1>File Storage Service</h1>
    <p class="login-sub">Admin Console · loopback access only</p>
    <label class="field">
      <span class="field-label">Admin Token</span>
      <input id="login-token" type="password" required spellcheck="false"
             autocapitalize="off" autocomplete="off" placeholder="Paste TENANT_FS_ADMIN_TOKEN">
    </label>
    <p id="login-error" class="form-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    <p class="login-note">The token lives only in this page's session (sessionStorage); it survives a refresh and is cleared when the tab closes. It is never written to the URL or to disk.</p>
  </form>
</div>

<!-- Main app shell: shown after login succeeds -->
<div id="app-shell" class="shell" hidden>
  <aside class="sidebar">
    <div class="side-brand">
      <div class="brand-mark sm" aria-hidden="true"></div>
      <span>File Storage Service</span>
    </div>
    <nav class="side-nav" id="side-nav">
      <button class="nav-item" data-view="apps"><span class="nav-ico" aria-hidden="true">▣</span>Apps</button>
      <button class="nav-item" data-view="audit"><span class="nav-ico" aria-hidden="true">☰</span>Audit Log</button>
      <button class="nav-item" data-view="backup"><span class="nav-ico" aria-hidden="true">◷</span>Backup</button>
    </nav>
    <div class="side-foot">
      <button id="btn-logout" class="btn btn-ghost btn-block">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="view-title">Apps</h2>
      <div id="topbar-actions" class="topbar-actions"></div>
    </header>
    <p id="global-error" class="banner banner-error" role="alert" hidden></p>

    <!-- Apps view -->
    <section id="view-apps" class="view">
      <div class="table-card">
        <div id="apps-table-wrap" class="table-wrap"></div>
      </div>
    </section>

    <!-- Audit view -->
    <section id="view-audit" class="view" hidden>
      <div class="filter-bar">
        <label class="field inline">
          <span class="field-label">App ID</span>
          <input id="audit-app-id" type="number" min="1" placeholder="All" spellcheck="false">
        </label>
        <label class="field inline">
          <span class="field-label">Time range</span>
          <select id="audit-since">
            <option value="0">All</option>
            <option value="86400">Last 24 hours</option>
            <option value="604800">Last 7 days</option>
            <option value="2592000">Last 30 days</option>
          </select>
        </label>
        <button id="audit-refresh" class="btn btn-ghost">Refresh</button>
      </div>
      <div class="table-card">
        <div id="audit-table-wrap" class="table-wrap"></div>
      </div>
    </section>

    <!-- Backup view (degrades gracefully when the endpoint is not implemented) -->
    <section id="view-backup" class="view" hidden>
      <div class="table-card">
        <div id="backup-wrap"></div>
      </div>
    </section>
  </main>
</div>

<!-- Modal mount point (all content is built by app.js via DOM APIs) -->
<div id="modal-root"></div>

<script src="app.js" defer></script>
</body>
</html>
